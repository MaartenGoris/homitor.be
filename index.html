<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Homitor – Live kweekwand</title>
<meta name="description" content="Live metingen van de Homitor kweekwand: pH, EC, temperatuur, luchtvochtigheid en camerabeeld.">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #1a1a1a; --panel: #262626; --line: #3a3a3a; --text: #e0e0e0; --muted: #9a9a9a;
    --green: #6fbf73; --gold: #c89937; --red: #d9534f; --orange: #f0912f;
  }
  body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg); color: var(--text); line-height: 1.5; }
  header { background: #222; border-bottom: 3px solid var(--green); }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 0 16px; }
  header .wrap { display: flex; justify-content: space-between; align-items: center; padding-top: 14px; padding-bottom: 14px; gap: 12px; }
  .logo { font-size: 1.5rem; font-weight: 700; } .logo span { color: var(--green); }
  #status { font-size: .9rem; color: var(--muted); text-align: right; }
  #status .live { color: var(--green); } #status .stale { color: var(--gold); }
  main { padding: 24px 0 40px; display: grid; gap: 20px; }
  h2 { font-size: 1.05rem; color: var(--muted); font-weight: 600; margin-bottom: 10px; }
  .panel { background: var(--panel); border-radius: 10px; padding: 16px; }
  .tiles { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); }
  #tiles { display: grid; gap: 10px; }
  .grp-title { grid-column: 1 / -1; font-size: .95rem; color: var(--text); font-weight: 600; margin: 6px 0 -2px; }
  .tile { background: var(--panel); border-radius: 10px; padding: 14px 16px; border-left: 4px solid var(--line); }
  .tile.ok { border-left-color: var(--green); } .tile.warn { border-left-color: var(--orange); } .tile.off { border-left-color: var(--red); opacity: .75; }
  .tile.alarm { border-left-color: var(--red); animation: tile-alarm 1s steps(1) infinite; }
  .tile.alarm .value { color: var(--red); }
  .tile.warn .value, .tile .value.sev-warn { color: var(--orange); } .tile .value.sev-alarm { color: var(--red); }
  .tile.warn { background: rgba(240,145,47,.12); }
  .tile .value.sev-ok, .tile .value.sev-off { color: var(--text); }
  .tile .values { display: flex; gap: 14px; flex-wrap: wrap; }
  @keyframes tile-alarm { 50% { border-left-color: transparent; background: rgba(217,83,79,.15); } }
  .tile .name { color: var(--muted); font-size: .9rem; }
  .tile .value { font-size: 1.9rem; font-weight: 600; font-variant-numeric: tabular-nums; }
  .tile .unit { font-size: 1rem; color: var(--muted); margin-left: 4px; }
  .tile .sub { font-size: .8rem; color: var(--muted); }
  .charts { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
  .chart-title { color: var(--muted); font-size: .9rem; }
  .chart-box { height: 190px; }
  .row { display: grid; gap: 20px; grid-template-columns: 3fr 2fr; }
  #photo { width: 100%; border-radius: 8px; display: block; background: #111; }
  .relay { display: flex; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--line); }
  .relay:last-child { border-bottom: none; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #555; margin-right: 10px; flex: none; }
  .dot.on { background: var(--green); box-shadow: 0 0 6px var(--green); }
  .ev { display: grid; grid-template-columns: 110px 1fr; gap: 10px; padding: 4px 0; border-bottom: 1px solid #2f2f2f; font-size: .9rem; }
  .ev .t { color: var(--muted); font-variant-numeric: tabular-nums; }
  .empty { color: var(--muted); padding: 30px 0; text-align: center; }
  .ai-summary { font-size: 1.05rem; margin-bottom: 10px; }
  .ai-meta { color: var(--muted); font-size: .85rem; margin-bottom: 8px; }
  .ai-grid { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); margin: 10px 0; }
  .ai-grid div { background: #1f1f1f; border-radius: 8px; padding: 10px; font-size: .92rem; }
  .ai-grid b { display: block; color: var(--muted); font-size: .8rem; margin-bottom: 4px; }
  .risk { display: inline-block; font-size: .8rem; padding: 2px 9px; border-radius: 10px; margin: 0 6px 6px 0; cursor: help; }
  .risk.laag { background: rgba(111,191,115,.18); color: var(--green); }
  .risk.middel { background: rgba(200,153,55,.18); color: var(--gold); }
  .risk.hoog { background: rgba(217,83,79,.2); color: #e06c69; }
  .prop { padding: 8px 0; border-top: 1px solid var(--line); font-size: .92rem; }
  .prop span { color: var(--muted); font-size: .82rem; }
  .status { display: flex; align-items: center; gap: 18px; }
  .lamps { display: flex; gap: 8px; background: #111; padding: 8px 10px; border-radius: 22px; flex: none; }
  .lamp { width: 26px; height: 26px; border-radius: 50%; background: #2c2c2c; }
  .lamp.on.red { background: var(--red); box-shadow: 0 0 12px var(--red); }
  .lamp.on.yellow { background: var(--gold); box-shadow: 0 0 12px var(--gold); }
  .lamp.on.green { background: var(--green); box-shadow: 0 0 12px var(--green); }
  .status .state { font-size: 1.15rem; font-weight: 600; }
  .status .reasons { color: var(--muted); font-size: .88rem; margin-top: 2px; }
  footer { border-top: 1px solid var(--line); padding: 20px 0; color: var(--muted); font-size: .85rem; }
  footer a { color: var(--green); }
  @media (max-width: 760px) { .row { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="logo">Hom<span>itor</span></div>
    <div id="status">laden…</div>
  </div>
</header>

<main class="wrap">
  <section class="panel status" id="light" hidden>
    <div class="lamps"><div class="lamp red"></div><div class="lamp yellow"></div><div class="lamp green"></div></div>
    <div><div class="state" id="light-state"></div><div class="reasons" id="light-reasons"></div></div>
  </section>

  <section><div id="tiles"></div></section>

  <section class="panel">
    <h2>Laatste 48 uur</h2>
    <div class="charts" id="charts"></div>
  </section>

  <section class="row">
    <div class="panel">
      <h2 id="photo-title">Camera</h2>
      <img id="photo" alt="Laatste foto van de kweekwand">
    </div>
    <div class="panel">
      <h2>Uitgangen</h2>
      <div id="relays"></div>
    </div>
  </section>

  <section class="panel">
    <h2>AI-besturing</h2>
    <div id="ai"><div class="empty">Nog geen AI-analyse.</div></div>
  </section>

  <section class="panel">
    <h2>Recente gebeurtenissen</h2>
    <div id="events"></div>
  </section>
</main>

<footer>
  <div class="wrap">Homitor – een AI-gestuurde kweekwand in opbouw · een project van <a href="https://www.endego.be">EnDeGo</a></div>
</footer>

<script>
// Data is published by the Pi to the 'data' branch of this repository
const DATA_URL = 'https://raw.githubusercontent.com/MaartenGoris/homitor.be/data/';
const charts = {};
const fmtDateTime = ts => new Date(ts * 1000).toLocaleString('nl-BE', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
const fmtTick = ts => new Date(ts * 1000).toLocaleString('nl-BE', { weekday: 'short', hour: '2-digit', minute: '2-digit' });
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function renderStatus(updated) {
  const age = (Date.now() / 1000 - updated) / 60;
  const cls = age < 15 ? 'live' : 'stale';
  document.getElementById('status').innerHTML =
    `<span class="${cls}">●</span> bijgewerkt ${fmtDateTime(updated)}${age >= 15 ? ' (verouderd)' : ''}`;
}

// Sensors per group (Water, Omgeving, ...), in the published order
function byGroup(sensors) {
  const groups = {};
  for (const [k, s] of Object.entries(sensors)) (groups[s.group || ''] ||= []).push([k, s]);
  return Object.entries(groups);
}

// Sensors with the same tile label (temperature + humidity of one node) share one tile
const SEV_RANK = { ok: 0, warn: 1, off: 2, alarm: 3 };
function sensorClass(s) {
  if (!s.online || s.value === null) return 'off';
  if (s.severity) return s.severity;
  // older snapshots without severity: work it out from the target (alarm = target widened by half its width)
  if (!s.target) return 'ok';
  const [lo, hi] = s.target, m = (hi - lo) / 2, [alo, ahi] = s.alarm || [lo - m, hi + m];
  return s.value < alo || s.value > ahi ? 'alarm' : s.value < lo || s.value > hi ? 'warn' : 'ok';
}
function tileHtml(name, items) {
  const cls = items.map(([, s]) => sensorClass(s)).reduce((a, b) => SEV_RANK[b] > SEV_RANK[a] ? b : a);
  const value = s => `${s.value ?? '–'}<span class="unit">${esc(s.unit)}</span>`;
  const target = s => s.target ? `${s.target[0]} – ${s.target[1]}` : '';
  if (items.length === 1) {
    const s = items[0][1];
    const sub = sensorClass(s) === 'off' ? 'geen meting' : s.target ? 'doel ' + target(s) : '';
    return `<div class="tile ${cls}"><div class="name">${esc(name)}</div><div class="value">${value(s)}</div><div class="sub">${sub}</div></div>`;
  }
  const values = items.map(([, s]) => `<div class="value sev-${sensorClass(s)}">${value(s)}</div>`).join('');
  const sub = items.some(([, s]) => sensorClass(s) === 'off') ? 'geen meting' : 'doel ' + items.map(([, s]) => target(s)).filter(Boolean).join(' · ');
  return `<div class="tile ${cls}"><div class="name">${esc(name)}</div><div class="values">${values}</div><div class="sub">${sub}</div></div>`;
}

function renderTiles(sensors) {
  document.getElementById('tiles').innerHTML = byGroup(sensors).map(([group, list]) => {
    const tiles = [], byTile = {};
    for (const [k, s] of list) {
      if (s.tile && byTile[s.tile]) byTile[s.tile].items.push([k, s]);
      else { const t = { name: s.tile || s.name, items: [[k, s]] }; tiles.push(t); if (s.tile) byTile[s.tile] = t; }
    }
    return (group ? `<div class="grp-title">${esc(group)}</div>` : '') +
      '<div class="tiles">' + tiles.map(t => tileHtml(t.name, t.items)).join('') + '</div>';
  }).join('');
}

// Sensors of the same group with the same unit (e.g. the air temperatures) share one chart, one line each
const LINE_COLORS = ['#6fbf73', '#c89937', '#5fa8d3', '#c678dd'];
const baseName = name => name.replace(/\s*(\(.*\)|\d+)$/, '');   // 'Luchttemperatuur 2' / '... (SHT20)' -> 'Luchttemperatuur'

function renderCharts(history, sensors) {
  const box = document.getElementById('charts');
  const groups = {};
  for (const k of Object.keys(history)) if (sensors[k]) (groups[(sensors[k].group || '') + '|' + sensors[k].unit] ||= []).push(k);
  const ids = Object.values(groups).map(keys => keys.join('+'));   // a new sensor in a group gives a new chart
  if (ids.some(id => !charts[id])) {                               // layout changed: build all charts again
    for (const c of Object.values(charts)) c.destroy();
    for (const id of Object.keys(charts)) delete charts[id];
    box.innerHTML = '';
  }
  for (const [gu, keys] of Object.entries(groups)) {
    const [group, unit] = gu.split('|');
    const id = keys.join('+');
    if (!charts[id]) {
      const multi = keys.length > 1;
      if (group && !box.querySelector(`[data-group="${CSS.escape(group)}"]`))
        box.insertAdjacentHTML('beforeend', `<div class="grp-title" data-group="${esc(group)}">${esc(group)}</div>`);
      const div = document.createElement('div');
      div.innerHTML = `<div class="chart-title">${esc(multi ? baseName(sensors[keys[0]].name) : sensors[keys[0]].name)} (${esc(unit)})</div><div class="chart-box"><canvas></canvas></div>`;
      box.appendChild(div);
      charts[id] = new Chart(div.querySelector('canvas'), {
        type: 'line',
        data: { datasets: keys.map((k, i) => ({
          label: multi ? (sensors[k].name.match(/\((.*)\)$/) || [, sensors[k].name])[1] : sensors[k].name,
          data: [], borderColor: LINE_COLORS[i % LINE_COLORS.length], backgroundColor: LINE_COLORS[i % LINE_COLORS.length],
          borderWidth: 2, pointRadius: 2, tension: .25 })) },
        options: {
          responsive: true, maintainAspectRatio: false, animation: false, parsing: false,
          plugins: {
            legend: { display: multi, labels: { color: '#bbb', boxWidth: 12, boxHeight: 2 } },
            tooltip: { callbacks: { title: i => fmtDateTime(i[0].parsed.x) } }
          },
          scales: {
            x: { type: 'linear', ticks: { color: '#888', maxTicksLimit: 5, callback: fmtTick }, grid: { color: '#2f2f2f' } },
            y: { ticks: { color: '#888' }, grid: { color: '#2f2f2f' } }
          }
        }
      });
    }
    // Fixed 48 h window: with few points the automatic axis is meaningless
    const now = Date.now() / 1000;
    charts[id].options.scales.x.min = now - 48 * 3600;
    charts[id].options.scales.x.max = now;
    keys.forEach((k, i) => charts[id].data.datasets[i].data = history[k].map(([x, y]) => ({ x, y })));
    charts[id].update();
  }
}

const LIGHT_STATES = { green: 'Alles in orde', yellow: 'Aandacht nodig', red: 'Probleem' };

function renderLight(light) {
  if (!light) return;
  document.getElementById('light').hidden = false;
  for (const lvl of ['red', 'yellow', 'green'])
    document.querySelector(`.lamp.${lvl}`).classList.toggle('on', light.level === lvl);
  document.getElementById('light-state').textContent = LIGHT_STATES[light.level] || light.level;
  document.getElementById('light-reasons').textContent = light.reasons.length
    ? light.reasons.map(r => r.text).join(' · ') : 'Alle metingen binnen doelbereik, geen opmerkingen van de AI.';
}

function renderPhoto(photo) {
  if (!photo) return;
  document.getElementById('photo').src = `${DATA_URL}${photo.file}?t=${Math.round(photo.taken)}`;
  document.getElementById('photo-title').textContent = `Camera – ${fmtDateTime(photo.taken)}`;
}

function renderRelays(relays) {
  document.getElementById('relays').innerHTML = Object.values(relays).map(r =>
    `<div class="relay"><span class="dot ${r.on ? 'on' : ''}"></span>${esc(r.name)}</div>`).join('');
}

const STATUS = { pending: 'wacht op goedkeuring', executed: 'uitgevoerd', rejected: 'afgewezen', blocked: 'geweigerd door veiligheidslaag', failed: 'mislukt' };

function renderAI(a) {
  if (!a) return;
  const props = a.proposals.length
    ? a.proposals.map(p => `<div class="prop">${esc(p.relay)} ${p.action === 'dose' ? p.duration_s + ' ml' : p.action === 'off' ? 'uit' : 'aan' + (p.duration_s > 0 ? ' ' + p.duration_s + ' s' : '')} · ${esc(STATUS[p.status] || p.status)}<br><span>${esc(p.reason)}</span></div>`).join('')
    : '<div class="prop"><span>Geen acties.</span></div>';
  document.getElementById('ai').innerHTML = `
    <div class="ai-meta">${fmtDateTime(a.ts)} · ${esc(a.model)}</div>
    <div class="ai-summary">${esc(a.summary)}</div>
    <div>${a.risks.map(r => `<span class="risk ${esc(r.level)}" title="${esc(r.explanation)}">${esc(r.name)}: ${esc(r.level)}</span>`).join('')}</div>
    <div class="ai-grid"><div><b>Oplossing</b>${esc(a.solution)}</div><div><b>Klimaat</b>${esc(a.climate)}</div><div><b>Foto</b>${esc(a.photo)}</div></div>
    ${props}
    ${a.next_check_minutes ? `<div class="ai-meta" style="margin-top:8px">Volgende ronde over ${a.next_check_minutes} min</div>` : ''}`;
}

function renderEvents(events) {
  document.getElementById('events').innerHTML = events.length
    ? events.map(e => `<div class="ev"><span class="t">${fmtDateTime(e.ts)}</span><span>${esc(e.message)}</span></div>`).join('')
    : '<div class="empty">Nog geen gebeurtenissen.</div>';
}

async function refresh() {
  try {
    const res = await fetch(`${DATA_URL}data.json?t=${Date.now()}`, { cache: 'no-store' });
    if (!res.ok) throw new Error(res.status);
    const d = await res.json();
    renderStatus(d.updated); renderLight(d.light); renderTiles(d.sensors); renderCharts(d.history, d.sensors);
    renderPhoto(d.photo); renderRelays(d.relays); renderEvents(d.events); renderAI(d.ai);
  } catch (e) {
    document.getElementById('status').textContent = 'nog geen live data beschikbaar';
    if (!document.getElementById('tiles').innerHTML)
      document.getElementById('tiles').innerHTML = '<div class="empty">De kweekwand heeft nog geen data gepubliceerd.</div>';
  }
}

refresh();
setInterval(refresh, 60000);
</script>
</body>
</html>
